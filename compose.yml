# Production: the Sabacc image behind Traefik (already running on the server).
# Everything server-specific comes from .env next to this file (see .env.example):
# the image, the pinned tag, the host name and your Traefik names.
#
#   docker compose pull && docker compose up -d
#
# See docs/DEPLOY.md.
name: sabacc # fixed, so the data volume is "sabacc_sabacc-data" whatever the folder is called

services:
  sabacc:
    image: ${SABACC_IMAGE:-sabacc}:${SABACC_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATA_DIR: /data
      TURN_SECONDS: ${TURN_SECONDS:-45}
      GRACE_SECONDS: ${GRACE_SECONDS:-30}
      AUTO_DEAL_SECONDS: ${AUTO_DEAL_SECONDS:-20}
      HEARTBEAT_SECONDS: ${HEARTBEAT_SECONDS:-25}
      IDLE_CLOSE_SECONDS: ${IDLE_CLOSE_SECONDS:-1800}
      DELETE_AFTER_SECONDS: ${DELETE_AFTER_SECONDS:-86400}
      ROOMS_PER_IP_PER_HOUR: ${ROOMS_PER_IP_PER_HOUR:-20}
      KEEP_BACKUPS: ${KEEP_BACKUPS:-14}
    volumes:
      - sabacc-data:/data
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.sabacc.rule=Host(`${SABACC_HOST:?set SABACC_HOST in .env}`)
      - traefik.http.routers.sabacc.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.sabacc.tls=true
      - traefik.http.routers.sabacc.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.sabacc.loadbalancer.server.port=8080
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  sabacc-data:

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
