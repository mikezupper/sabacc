name: Idea or rule change
description: Suggest a feature, a UI improvement or a change to the rules.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Rule changes are product decisions: the spec in docs/product-specs/sabacc-rules.md
        changes first, then the code. If you're proposing one, cite a source if there is
        one (Legends lore, the West End Games rules, the canon abridged rules), as the spec does.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Gameplay or UI
        - Rules (changes the spec)
        - Multiplayer or server
        - Accessibility
        - Developer experience
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What would it improve?
      description: The problem or the moment in a game where you missed it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources (for rule changes)
