name: ci

# Runs on the maintainer's self-hosted runner (label `sabacc`), not on GitHub-hosted
# runners, so it uses no Actions minutes. It reuses the machine's Node (v24) and
# Playwright Chromium. Only pushes to main and manual runs trigger it. Never add
# `pull_request` or `pull_request_target`: the repo is public and a fork's code would
# run on that machine. The runner also refuses any other job itself
# (scripts/ci/runner-guard.sh), since a fork PR could bring its own workflow file.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, sabacc]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Toolchain
        run: node --version && npm --version
      - run: npm ci --no-audit --no-fund
      # Downloads Chromium only if this Playwright version's build is missing.
      - run: npx playwright install chromium
      - run: npm run check
