name: ci

# Fresh Xode workers use the existing personal repository registration.
# Only trusted main pushes and manual runs execute; the fleet rejects PR events.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: xode-linux-x64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the fresh worker
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y build-essential python3 xz-utils unzip
          sudo mkdir -p "$RUNNER_TOOL_CACHE"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TOOL_CACHE"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
